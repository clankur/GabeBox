<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Steam library | Xbox Dev Mode</title>
    <link rel="stylesheet" href="steam-signin.css">
    <link rel="stylesheet" href="library-tv.css">
</head>
<body>
    <main>
        <section id="signin" aria-labelledby="title">
            <div>
                <h1 id="title">Steam sign-in</h1>
                <p class="device">Xbox Developer Mode client</p>
                <p id="status" role="status" aria-live="polite">Preparing Steam Guard sign-in…</p>
                <label id="remember-session" hidden>
                    <input id="remember" type="checkbox">
                    Remember sign-in on this Xbox
                </label>
                <div class="actions">
                    <button id="retry" hidden>Get a new code</button>
                    <button id="cancel" hidden>Cancel</button>
                </div>
            </div>
            <canvas id="code" aria-label="Steam Guard QR code" hidden></canvas>
        </section>
        <section id="library" aria-labelledby="library-title" hidden>
            <header class="library-header">
                <div>
                    <h1 id="library-title">Steam library</h1>
                    <p id="library-count" class="device" role="status"></p>
                </div>
                <button id="sign-out">Sign out</button>
            </header>
            <div class="library-columns">
                <div class="catalog">
                    <label for="library-search">Search games</label>
                    <input id="library-search" type="search" autocomplete="off">
                    <div id="library-list" aria-label="Library games"></div>
                    <p id="library-empty" hidden></p>
                </div>
                <section class="entry" aria-labelledby="entry-name">
                    <h2 id="entry-name"></h2>
                    <button id="play" hidden>Play</button>
                    <button id="download" hidden>Download</button>
                    <button id="cloud-saves" aria-controls="cloud-saves-panel" aria-expanded="false" hidden>Cloud saves</button>
                    <div id="cloud-saves-panel" hidden>
                        <p>Use the saves from Steam on this Xbox. Existing Xbox saves are backed up before replacement.</p>
                        <button id="cloud-saves-open">Download and use saves</button>
                        <p id="cloud-saves-status" role="status" aria-live="polite"></p>
                    </div>
                    <p id="download-status" class="download-status" role="status" aria-live="polite"></p>
                </section>
            </div>
        </section>
        <section id="sdl-game" aria-labelledby="sdl-game-title" hidden>
            <h2 id="sdl-game-title" hidden></h2>
            <p id="sdl-status" role="status"></p>
            <div id="sdl-picture">
                <canvas id="sdl-frame" width="1" height="1" tabindex="0" aria-label="Game"></canvas>
                <span id="sdl-pointer" aria-hidden="true"></span>
            </div>
            <div id="sdl-menu" role="dialog" aria-label="Game controls" hidden>
                <button id="sdl-resume">Resume</button>
                <button id="sdl-keyboard" hidden>Keyboard</button>
                <button id="sdl-exit">Quit to library</button>
            </div>
            <form id="sdl-text" role="dialog" aria-label="Type into the game" hidden>
                <label for="sdl-text-value">Type into the game</label>
                <input id="sdl-text-value" type="text" maxlength="96" autocomplete="off">
                <button id="sdl-text-send" type="submit">Send text</button>
                <button id="sdl-text-cancel" type="button">Cancel</button>
                <p id="sdl-text-status" role="status"></p>
            </form>
        </section>
    </main>
    <script src="qrcode.js"></script>
    <script src="library-art.js"></script>
    <script src="library-navigation.js"></script>
    <script src="steam-cloud.js"></script>
    <script src="steam-game-launch.js"></script>
    <script src="steam-signin.js"></script>
</body>
</html>
