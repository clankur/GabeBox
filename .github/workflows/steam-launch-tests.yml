name: Test Steam game launch

on:
  push:
    paths: ['build_tools/**', 'tools/**', 'runtime/**', 'ui/**', 'probe/**', 'tests/**', 'profiles/**', '.github/workflows/steam-launch-tests.yml']
  pull_request:
    paths: ['build_tools/**', 'tools/**', 'runtime/**', 'ui/**', 'probe/**', 'tests/**', 'profiles/**', '.github/workflows/steam-launch-tests.yml']

permissions:
  contents: read

jobs:
  launch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js tests/big-picture-webview/*.test.js
      - run: python -m unittest discover -s tests
      - run: g++ -std=c++20 -Wall -Wextra -Werror tests/steam-launch-detail.test.cpp -o /tmp/steam-launch-detail-test && /tmp/steam-launch-detail-test
      - run: g++ -std=c++20 -Wall -Wextra -Werror tests/steam-cloud-manifest.test.cpp -o /tmp/steam-cloud-manifest-test && /tmp/steam-cloud-manifest-test
      - run: g++ -std=c++20 -Wall -Wextra -Werror tests/steam-library-manifest.test.cpp -o /tmp/steam-library-manifest-test && /tmp/steam-library-manifest-test
      - run: g++ -std=c++20 -O2 -Wall -Wextra -Werror tests/steam-sdl-frame.test.cpp -o /tmp/steam-sdl-frame-test && /tmp/steam-sdl-frame-test
