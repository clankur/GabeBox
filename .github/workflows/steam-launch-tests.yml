name: Test Steam game launch

on:
  push:
    paths:
      - 'probe/signin/**'
      - 'probe/big-picture-bridge/**'
      - 'probe/big-picture-webview/**'
      - 'probe/prepare-big-picture-library.py'
      - 'probe/prepare-steam-core.py'
      - 'probe/ProbeNative.cpp'
      - 'probe/SteamCloud*.h'
      - 'probe/sdl-frame-copy.h'
      - 'probe/XboxProbe.Native.idl'
      - 'tests/**'
      - '.github/workflows/steam-launch-tests.yml'
  pull_request:
    paths:
      - 'probe/signin/**'
      - 'probe/big-picture-bridge/**'
      - 'probe/big-picture-webview/**'
      - 'probe/prepare-big-picture-library.py'
      - 'probe/prepare-steam-core.py'
      - 'probe/ProbeNative.cpp'
      - 'probe/SteamCloud*.h'
      - 'probe/sdl-frame-copy.h'
      - 'probe/XboxProbe.Native.idl'
      - 'tests/**'
      - '.github/workflows/steam-launch-tests.yml'

permissions:
  contents: read

jobs:
  launch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js probe/big-picture-webview/*.test.js
      - run: python -m unittest discover -s tests
      - run: g++ -std=c++20 -Wall -Wextra -Werror tests/steam-cloud-manifest.test.cpp -o /tmp/steam-cloud-manifest-test && /tmp/steam-cloud-manifest-test
      - run: g++ -std=c++20 -O2 -Wall -Wextra -Werror tests/steam-sdl-frame.test.cpp -o /tmp/steam-sdl-frame-test && /tmp/steam-sdl-frame-test
