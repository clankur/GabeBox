name: Test Steam game launch

on:
  push:
    paths: ['build_tools/**', 'tools/**', 'runtime/**', 'ui/**', 'probe/**', 'tests/**', 'profiles/**', 'analysis/**/*.py', 'pyproject.toml', 'uv.lock', '.github/workflows/steam-launch-tests.yml']
  pull_request:
    paths: ['build_tools/**', 'tools/**', 'runtime/**', 'ui/**', 'probe/**', 'tests/**', 'profiles/**', 'analysis/**/*.py', 'pyproject.toml', 'uv.lock', '.github/workflows/steam-launch-tests.yml']

permissions:
  contents: read

jobs:
  launch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.13'
      - run: uv run --locked ruff check
      - run: uv run --locked python -m pytest
      - run: node --test tests/*.test.js tests/big-picture-webview/*.test.js
      - name: Run portable Steam C++ tests
        shell: bash
        run: |
          for source in tests/steam-*.cpp; do
            echo "Testing $source"
            g++ -std=c++20 -O2 -Wall -Wextra -Werror "$source" -o "$RUNNER_TEMP/steam-test"
            "$RUNNER_TEMP/steam-test"
          done
