name: Test Steam game launch

on:
  push:
    paths:
      - 'probe/signin/**'
      - 'probe/prepare-steam-core.py'
      - 'probe/ProbeNative.cpp'
      - 'probe/XboxProbe.Native.idl'
      - 'tests/**'
      - '.github/workflows/steam-launch-tests.yml'
  pull_request:
    paths:
      - 'probe/signin/**'
      - 'probe/prepare-steam-core.py'
      - 'probe/ProbeNative.cpp'
      - 'probe/XboxProbe.Native.idl'
      - 'tests/**'
      - '.github/workflows/steam-launch-tests.yml'

permissions:
  contents: read

jobs:
  launch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js
      - run: python -m unittest discover -s tests
