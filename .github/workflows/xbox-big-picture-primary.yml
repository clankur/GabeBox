name: Build Xbox Big Picture primary XAML host

on:
  workflow_dispatch:
  push:
    branches: ['feature/native-steam-big-picture']
    paths:
      - 'probe/big-picture-primary/**'
      - '.github/workflows/xbox-big-picture-primary.yml'

permissions:
  contents: read

jobs:
  primary:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test primary manifest and script policy
        run: python probe/big-picture-primary/test-stage.py
      - name: Build and sign the x64 UWP XAML executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $src = Join-Path $PWD 'probe/big-picture-primary'
          $work = Join-Path $env:RUNNER_TEMP 'steam-primary'
          $out = Join-Path $work 'artifact'
          New-Item -ItemType Directory -Path $out | Out-Null
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $kit = (Get-ChildItem "$kits/Include" -Directory | Where-Object {
            Test-Path "$($_.FullName)/cppwinrt/winrt/Windows.UI.Xaml.h"
          } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          if (!$kit) { throw 'Windows SDK C++/WinRT projection missing' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & msbuild.exe "$src/SteamPrimary.vcxproj" /nologo /m /t:Link /p:Configuration=Release /p:Platform=x64 `
            "/p:WindowsTargetPlatformVersion=$kit" "/p:OutDir=$out\" "/p:IntDir=$work\obj\"
          $imports = & dumpbin.exe /imports "$out/SteamPrimary.exe"
          if (!($imports -match 'VCRUNTIME140_APP.dll')) { throw 'Missing UWP VCLibs app CRT import' }
          Remove-Item "$out/*.pdb" -ErrorAction SilentlyContinue
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Xbox Portability Probe' `
            -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256
          try {
            & "$kits/bin/$kit/x64/signtool.exe" sign /sha1 $cert.Thumbprint /fd SHA256 "$out/SteamPrimary.exe"
            $pin = (Get-FileHash "$out/SteamPrimary.exe").Hash.ToLowerInvariant()
            "$pin  SteamPrimary.exe" | Set-Content -Encoding ascii "$out/SHA256SUMS"
          } finally { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" }
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-big-picture-primary-x64
          path: ${{ runner.temp }}/steam-primary/artifact/
          if-no-files-found: error
