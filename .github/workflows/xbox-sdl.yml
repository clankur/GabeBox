name: Build SDL2 compatibility library

on:
  push:
    paths:
      - '.github/workflows/xbox-sdl.yml'
      - 'probe/add-sdl-startup-trace.py'
      - 'probe/add-sdl-surfaceless.py'
      - 'probe/sdl-startup-trace.h'
      - 'probe/sdl-local-preferences.h'
      - 'probe/sdl-software-frame.h'
      - 'probe/sdl-host-protocol.h'
      - 'probe/sdl-host-runtime.h'
      - 'probe/sdl-surfaceless-framebuffer.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdl2-x64:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '2.32.10'
            sha256: '5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165'
            artifact: xbox-sdl2-x64
          - version: '2.26.2'
            sha256: '95d39bc3de037fbdfa722623737340648de4f180a601b0afad27645d150b99e0'
            artifact: xbox-sdl2-2.26.2-x64
          - version: '2.30.9'
            sha256: '24b574f71c87a763f50704bbb630cbe38298d544a1f890f099a4696b1d6beba4'
            artifact: xbox-sdl2-2.30.9-x64
    env:
      SDL_VERSION: ${{ matrix.version }}
      SDL_SOURCE_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Build SDL2 with the desktop IME disabled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $work = New-Item -ItemType Directory "$env:RUNNER_TEMP\xbox-sdl"
          Set-Location $work.FullName
          $version = $env:SDL_VERSION
          $archive = "SDL2-$version.tar.gz"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$version/$archive" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:SDL_SOURCE_SHA256) {
            throw 'Unexpected SDL2 source digest.'
          }
          tar -xf $archive
          if ($version -in @('2.26.2', '2.30.9')) {
            python "$env:GITHUB_WORKSPACE/probe/add-sdl-startup-trace.py" "SDL2-$version"
          }
          if ($version -eq '2.30.9') {
            python "$env:GITHUB_WORKSPACE/probe/add-sdl-surfaceless.py" "SDL2-$version"
          }
          # CMake 4 needs a policy floor of at least 3.5 for older SDL releases.
          $env:CMAKE_POLICY_VERSION_MINIMUM = '3.5'
          cmake -S "SDL2-$version" -B build -G "Visual Studio 17 2022" -A x64 `
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF -DCMAKE_C_FLAGS=/DSDL_DISABLE_WINDOWS_IME
          cmake --build build --config Release --target SDL2
          $library = Get-Item build/Release/SDL2.dll
          $imports = & "$env:ProgramFiles\LLVM\bin\llvm-readobj.exe" --coff-imports $library.FullName
          if ($imports -match 'ImmGetIMEFileNameA') {
            throw 'The build still imports the unavailable Xbox entry point.'
          }
          $output = New-Item -ItemType Directory output
          Copy-Item $library.FullName, "SDL2-$version/LICENSE.txt" $output.FullName
          $hash = (Get-FileHash $library -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$output/SHA256SUMS", "$hash  SDL2.dll`n")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/xbox-sdl/output/
          if-no-files-found: error
