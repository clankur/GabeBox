name: Build Xbox controller pointer probe

on:
  workflow_dispatch:
    inputs:
      version:
        description: four-component APPX version for the HID build
        required: true
        default: 1.0.2.1
  push:
    paths:
      - 'probe/controller-pointer/**'
      - 'build_tools/prepare_controller_pointer.py'
      - 'build_tools/redirect_pe_imports.py'
      - 'build_tools/paths.py'
      - 'probe/catalog.py'
      - '.github/workflows/xbox-controller-pointer.yml'
  pull_request:
    paths:
      - 'probe/controller-pointer/**'
      - 'build_tools/prepare_controller_pointer.py'
      - 'build_tools/redirect_pe_imports.py'
      - 'build_tools/paths.py'
      - 'probe/catalog.py'
      - '.github/workflows/xbox-controller-pointer.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign the standalone controller pointer probe
        shell: pwsh
        env:
          HID_VERSION: ${{ inputs.version || '1.0.2.1' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkVersion = (Get-ChildItem "$sdk\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' -and
              (Test-Path "$($_.FullName)\x64\MakeAppx.exe") -and
              (Test-Path "$($_.FullName)\x64\MakePri.exe") -and
              (Test-Path "$sdk\Include\$($_.Name)\cppwinrt\winrt\base.h") -and
              (Test-Path "$sdk\Lib\$($_.Name)\um\x64\WindowsApp.lib") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          if (!$sdkVersion) { throw 'No Windows SDK with MakeAppx, C++/WinRT headers and WindowsApp.lib was found.' }
          $bin = "$sdk\bin\$sdkVersion\x64"
          $lib = "$sdk\Lib\$sdkVersion\um\x64\WindowsApp.lib"
          $work = Join-Path $env:RUNNER_TEMP 'controller-pointer'
          $artifacts = Join-Path $work 'artifacts'
          New-Item -ItemType Directory -Path $work, $artifacts | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          & cl.exe /nologo /O2 /EHsc /MD /std:c++20 /DNOMINMAX /DUNICODE /D_UNICODE `
            /DWINAPI_FAMILY=WINAPI_FAMILY_APP /DWINVER=0x0A00 /D_WIN32_WINNT=0x0A00 `
            "/I$sdk\Include\$sdkVersion\cppwinrt" "/Fo$work\native-app.obj" "/Fe$work\ControllerPointer.exe" `
            probe/controller-pointer/native-app.cpp $lib /link /APPCONTAINER /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT

          & "$bin\MakePri.exe" createconfig /cf "$work/priconfig.xml" /dq lang-en-US /pv 10.0.0
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Xbox Portability Probe' `
            -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256
          try {
            Export-Certificate -Cert $cert -FilePath "$artifacts/XboxControllerPointer.cer" | Out-Null
            # The baseline build declares no capabilities. The HID build adds the
            # joystick and gamepad collections, so an install failure or a nonzero
            # HID count is attributable to that declaration alone.
            $builds = @(
              @{ Name = 'baseline'; Version = '1.0.2.0'; Options = @() },
              @{ Name = 'hid'; Version = $env:HID_VERSION; Options = @('--hid') }
            )
            foreach ($build in $builds) {
              $layout = Join-Path $work "layout-$($build.Name)"
              & python -m build_tools.prepare_controller_pointer "$work\ControllerPointer.exe" $build.Version $layout @($build.Options)
              & "$bin\MakePri.exe" new /cf "$work/priconfig.xml" /pr $layout /of "$layout/resources.pri"
              $appx = "$artifacts/XboxControllerPointer-$($build.Name)-$($build.Version).appx"
              & "$bin\MakeAppx.exe" pack /d $layout /p $appx
              & "$bin\SignTool.exe" sign /sha1 $cert.Thumbprint /fd SHA256 $appx
              Get-Content "$layout/AppxManifest.xml"
            }
          } finally {
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          }
          $hashes = Get-ChildItem $artifacts -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$artifacts/SHA256SUMS", ($hashes -join "`n") + "`n")
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-controller-pointer-x64
          path: ${{ runner.temp }}/controller-pointer/artifacts
          if-no-files-found: error
