name: Trace Steam startup on Windows

on:
  push:
    paths:
      - analysis/trace-steam-startup.ps1
      - analysis/stage-pinned-client.py
      - analysis/valve-release.json
      - analysis/steam_client_win64.manifest
      - .github/workflows/steam-windows-startup.yml
  workflow_dispatch:
    inputs:
      big_picture:
        type: boolean
        description: Verify the native Big Picture window on cold start
        default: false

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-2025
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install signed Steam and trace startup on a clean host
        shell: pwsh
        env:
          BIG_PICTURE: ${{ inputs.big_picture }}
        run: |
          $bigPicture = $env:BIG_PICTURE -eq 'true'
          ./analysis/trace-steam-startup.ps1 -WorkDirectory "$env:RUNNER_TEMP/steam-startup" -PinnedClient -BigPicture:$bigPicture
      - name: Upload Steam-only findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-windows-startup
          path: ${{ runner.temp }}/steam-startup/evidence/
          if-no-files-found: error
