name: Build mouse2xac firmware

on:
  push:
    paths:
      - 'hardware/mouse2xac/**'
      - '.github/workflows/mouse2xac-firmware.yml'
  pull_request:
    paths:
      - 'hardware/mouse2xac/**'
      - '.github/workflows/mouse2xac-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARDUINO_PICO_VERSION: 6.3.2
  PICO_PIO_USB_VERSION: 0.7.3
  # PIO USB runs only at 120 or 240 MHz; Adafruit TinyUSB is the stack the
  # sketch's device and host objects come from.
  FQBN: rp2040:rp2040:adafruit_feather_usb_host:freq=120,usbstack=tinyusb

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: 1.5.1
      - name: Install the pinned RP2040 core and Pico-PIO-USB
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install "rp2040:rp2040@${ARDUINO_PICO_VERSION}"
          arduino-cli lib install "Pico PIO USB@${PICO_PIO_USB_VERSION}"
      - name: Compile
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          arduino-cli compile --warnings default --fqbn "$FQBN" \
            --output-dir "$RUNNER_TEMP/out" hardware/mouse2xac
          cp "$RUNNER_TEMP/out/mouse2xac.ino.uf2" "$RUNNER_TEMP/mouse2xac.uf2"
          (cd "$RUNNER_TEMP" && sha256sum mouse2xac.uf2 > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mouse2xac-feather-rp2040-usb-host
          path: |
            ${{ runner.temp }}/mouse2xac.uf2
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
