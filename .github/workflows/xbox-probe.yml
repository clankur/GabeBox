name: Build Xbox probe

on:
  push:
    paths:
      - 'probe/**'
      - 'runtime/**'
      - 'ui/Assets/**'
      - 'ui/signin/**'
      - 'build_tools/**'
      - 'tools/artifacts.py'
      - '.github/workflows/xbox-probe.yml'
      - '.github/workflows/xbox-fhd-present.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presenter:
    uses: ./.github/workflows/xbox-fhd-present.yml
  windows-sdk-package:
    needs: presenter
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build the hosted MonoGame adapter
        run: dotnet build runtime/stardew/StardewStartupDiagnostic.csproj --configuration Release --output "${{ runner.temp }}/hosted-monogame"
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-hosted-monogame
          path: ${{ runner.temp }}/hosted-monogame/StardewStartupDiagnostic.dll
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: xbox-fhd-present-x64
          path: ${{ runner.temp }}/xbox-fhd-present
      - name: Build and sign with the Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkVersion = (Get-ChildItem "$sdk\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' -and
              (Test-Path "$($_.FullName)\x64\MakeAppx.exe") -and
              (Test-Path "$($_.FullName)\x64\MakePri.exe") -and
              (Test-Path "$sdk\Lib\$($_.Name)\um\x64\WindowsApp.lib") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          if (!$sdkVersion) { throw 'No Windows SDK with MakeAppx, MakePri, and WindowsApp.lib was found.' }
          $bin = "$sdk\bin\$sdkVersion\x64"
          $lib = "$sdk\Lib\$sdkVersion\um\x64\WindowsApp.lib"
          $llvm = "$env:ProgramFiles\LLVM\bin"
          $work = Join-Path $env:RUNNER_TEMP 'xbox-probe'
          $layout = Join-Path $work 'layout'
          $artifacts = Join-Path $work 'artifacts'
          New-Item -ItemType Directory -Path $layout, $artifacts | Out-Null
          Copy-Item -Recurse ui/Assets $layout
          Copy-Item probe/web/* $layout

          [xml]$manifest = Get-Content probe/Package.appxmanifest
          $app = $manifest.Package.Applications.Application
          $app.RemoveAttribute('Executable')
          $app.RemoveAttribute('EntryPoint')
          $app.SetAttribute('StartPage', 'index.html')
          $ns = $manifest.DocumentElement.NamespaceURI
          $extensions = $manifest.CreateElement('Extensions', $ns)
          $extension = $manifest.CreateElement('Extension', $ns)
          $extension.SetAttribute('Category', 'windows.activatableClass.inProcessServer')
          $server = $manifest.CreateElement('InProcessServer', $ns)
          $serverPath = $manifest.CreateElement('Path', $ns)
          $serverPath.InnerText = 'ProbeNative.dll'
          $class = $manifest.CreateElement('ActivatableClass', $ns)
          $class.SetAttribute('ActivatableClassId', 'XboxProbe.Native.ProbeRunner')
          $class.SetAttribute('ThreadingModel', 'both')
          $server.AppendChild($serverPath) | Out-Null
          $server.AppendChild($class) | Out-Null
          $extension.AppendChild($server) | Out-Null
          $extensions.AppendChild($extension) | Out-Null
          $manifest.Package.AppendChild($extensions) | Out-Null
          $manifest.Save("$layout/AppxManifest.xml")

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $metadata = "$sdk\UnionMetadata\$sdkVersion\Windows.winmd"
          $projection = Join-Path $work 'projection'
          $winmd = "$layout/XboxProbe.Native.winmd"
          & "$bin\midl.exe" /nologo /winrt /nomidl /h NUL /metadata_dir (Split-Path $metadata) /reference $metadata `
            /out $work /winmd $winmd runtime/steam/XboxProbe.Native.idl
          & "$bin\cppwinrt.exe" -input $winmd -reference $metadata -output $projection -include XboxProbe.Native -overwrite
          & cl.exe /nologo /LD /O2 /EHsc /MT /std:c++20 /DWINAPI_FAMILY=WINAPI_FAMILY_APP /DUNICODE /D_UNICODE `
            "/I$projection" "/I$sdk\Include\$sdkVersion\cppwinrt" "/Fo$work\ProbeNative.obj" "/Fe$layout\ProbeNative.dll" `
            runtime/steam/ProbeNative.cpp $lib /link /APPCONTAINER "/IMPLIB:$work/ProbeNative.lib" `
            /EXPORT:DllGetActivationFactory=ProbeGetActivationFactory /EXPORT:DllCanUnloadNow=ProbeCanUnloadNow

          $targets = @(
            @{ Source = 'child-process'; Extension = 'dll'; Flags = @('/dll', '/noentry') }
          )
          foreach ($target in $targets) {
            $source = $target.Source
            $options = $target.Flags
            & "$llvm\clang.exe" --target=x86_64-pc-windows-msvc -O2 -ffreestanding -Wall -Wextra -Werror `
              -c "probe/$source.c" -o "$work/$source.obj"
            & "$llvm\lld-link.exe" /nologo /machine:x64 /subsystem:windows,10.00 /appcontainer `
              /dynamicbase /nxcompat /highentropyva /nodefaultlib /Brepro @options `
              "/out:$layout/$source.$($target.Extension)" "$work/$source.obj" $lib
          }

          $helpers = @(
            @{ Source = 'child'; Entry = 'ChildEntry' },
            @{ Source = 'pipe-child'; Entry = 'PipeChildEntry' }
          )
          foreach ($helper in $helpers) {
            $source = $helper.Source
            & cl.exe /nologo /c /O2 /GS- /Zl /TC /DWINAPI_FAMILY=WINAPI_FAMILY_APP "/Fo$work\$source.obj" "probe/$source.c"
            & link.exe /nologo /machine:x64 /subsystem:windows /appcontainer /dynamicbase /nxcompat /highentropyva `
              /nodefaultlib "/entry:$($helper.Entry)" /manifest:embed /manifestuac:no "/out:$layout\$source.exe" "$work\$source.obj" $lib
          }

          $controlLayout = Join-Path $work 'control-layout'
          $controlArtifacts = Join-Path $work 'control-artifacts'
          Copy-Item -Recurse $layout $controlLayout
          New-Item -ItemType Directory -Path $controlArtifacts | Out-Null
          [xml]$control = Get-Content "$controlLayout/AppxManifest.xml"
          $control.Package.Identity.SetAttribute('Name', 'XboxPortabilityProbe.ChildProcess.Control')
          $control.Package.Properties.DisplayName = 'Packaged process startup control'
          $control.GetElementsByTagName('VisualElements', 'http://schemas.microsoft.com/appx/manifest/uap/windows10')[0].SetAttribute('DisplayName', 'Packaged process startup control')
          $control.Package.RemoveChild($control.Package.Extensions) | Out-Null
          $control.Save("$controlLayout/AppxManifest.xml")
          Remove-Item -LiteralPath "$controlLayout/ProbeNative.dll", "$controlLayout/XboxProbe.Native.winmd",
            "$controlLayout/child.exe", "$controlLayout/pipe-child.exe", "$controlLayout/child-process.dll"

          function Write-ProbePackage($packageLayout, $outputDir, $cert) {
            & "$bin\MakePri.exe" new /cf "$work/priconfig.xml" /pr $packageLayout /of "$packageLayout/resources.pri"
            $appx = "$outputDir/PackagedProcessProbe-x64.appx"
            & "$bin\MakeAppx.exe" pack /d $packageLayout /p $appx
            Export-Certificate -Cert $cert -FilePath "$outputDir/PackagedProcessProbe.cer" | Out-Null
            & "$bin\SignTool.exe" sign /sha1 $cert.Thumbprint /fd SHA256 $appx
            $hashes = Get-ChildItem $outputDir -File | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
            [IO.File]::WriteAllText("$outputDir/SHA256SUMS", ($hashes -join "`n") + "`n")
          }

          & "$bin\MakePri.exe" createconfig /cf "$work/priconfig.xml" /dq lang-en-US /pv 10.0.0
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Xbox Portability Probe' `
            -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256
          try {
            & "$bin\SignTool.exe" sign /sha1 $cert.Thumbprint /fd SHA256 "$layout/child.exe" "$layout/pipe-child.exe"
            # The downloadable template contains only our probe. Add the pinned Valve DLLs locally.
            $steamLayout = Join-Path $work 'steam-layout'
            $steamArtifacts = Join-Path $work 'steam-artifacts'
            Copy-Item -Recurse $layout $steamLayout
            New-Item -ItemType Directory -Path $steamArtifacts | Out-Null
            $jni = Join-Path $env:JAVA_HOME 'include'
            & cl.exe /nologo /c /O2 /GS- /Zl /TC /DWINAPI_FAMILY=WINAPI_FAMILY_APP `
              "/I$jni" "/I$jni\win32" "/Fo$work\slay-working-directory.obj" runtime/lwjgl/slay-working-directory.c
            & link.exe /nologo /dll /noentry /appcontainer /nodefaultlib `
              "/out:$steamLayout\slay-working-directory.dll" "/implib:$work\slay-working-directory.lib" `
              "$work\slay-working-directory.obj" $lib
            & cl.exe /nologo /LD /O2 /EHsc /MT /std:c++20 /DWINAPI_FAMILY=WINAPI_FAMILY_APP `
              "/I$jni" "/I$jni\win32" "/Fo$work\slay-sdl-display.obj" "/Fe$steamLayout\slay-sdl-display.dll" `
              runtime/lwjgl/slay-sdl-display.cpp $lib /link /APPCONTAINER "/IMPLIB:$work\slay-sdl-display.lib"
            $user32 = "$sdk\Lib\$sdkVersion\um\x64\User32.lib"
            foreach ($variant in @('ansi', 'wide')) {
              $defines = @(if ($variant -eq 'wide') { '/DPROBE_WIDE_IMPORT' })
              & cl.exe /nologo /c /O2 /GS- /Zl /TC @defines `
                "/Fo$work\keyboard-$variant.obj" runtime/win32/keyboard-import.c
              & link.exe /nologo /dll /noentry /appcontainer /nodefaultlib `
                "/out:$steamLayout\keyboard-$variant.dll" "/implib:$work\keyboard-$variant.lib" `
                "$work\keyboard-$variant.obj" $user32
            }
            foreach ($adapter in @(@{ Module = 'input'; Name = 'XboxWin32Input'; Sources = @('input', 'input-raw', 'xinput') },
                                    @{ Module = 'desktop'; Name = 'XboxWin32Desktop'; Sources = @('desktop') },
                                    @{ Module = 'loader-trace'; Name = 'XboxWin32LoaderTrace'; Sources = @('loader-trace') },
                                    @{ Module = 'unity'; Name = 'XboxWin32Unity'; Sources = @('unity') },
                                    @{ Module = 'display-config'; Name = 'XboxWin32DisplayConfig'; Sources = @('display-config') },
                                    @{ Module = 'hosted-display'; Name = 'XboxWin32HostedDisplay'; Sources = @('hosted-display') },
                                    @{ Module = 'player-prefs'; Name = 'XboxWin32PlayerPrefs'; Sources = @('player-prefs') },
                                    @{ Module = 'timer'; Name = 'XboxWin32Timer'; Sources = @('timer') },
                                    @{ Module = 'storage-trace'; Name = 'XboxWin32StorageTrace'; Sources = @('storage-trace') },
                                    @{ Module = 'crash-report'; Name = 'XboxWin32CrashReport'; Sources = @('crash-report') },
                                    @{ Module = 'transactions'; Name = 'ktmw32'; Sources = @('transactions') },
                                    @{ Module = 'steam-discovery'; Name = 'XboxWin32SteamDiscovery'; Sources = @('steam-discovery') },
                                    @{ Module = 'window'; Name = 'XboxWin32Window'; Sources = @('window', 'window-gl', 'window-monitor') })) {
              $objects = @(foreach ($source in $adapter.Sources) {
                $object = "$work/win32-$source.obj"
                & "$llvm\clang.exe" --target=x86_64-pc-windows-msvc -O2 -ffreestanding -Wall -Wextra -Werror `
                  -D_WIN32_WINNT=0x0a00 -DWINVER=0x0a00 -c "runtime/win32/$source.c" -o $object
                $object
              })
              $libraries = @($lib)
              if ($adapter.Module -eq 'loader-trace') {
                $exceptionLibrary = "$work\win32-exceptions.lib"
                & "$llvm\llvm-dlltool.exe" -m i386:x86-64 -d runtime/win32/ntdll-eh.def -l $exceptionLibrary
                $libraries += $exceptionLibrary
              }
              & "$llvm\lld-link.exe" /nologo /machine:x64 /subsystem:windows,10.00 /appcontainer `
                /dynamicbase /nxcompat /highentropyva /nodefaultlib /Brepro /dll /noentry `
                "/def:runtime/win32/$($adapter.Module).def" "/out:$steamLayout/$($adapter.Name).dll" @objects @libraries
            }
            & "$llvm\lld-link.exe" /nologo /machine:x64 /subsystem:windows,10.00 /appcontainer `
              /dynamicbase /nxcompat /highentropyva /nodefaultlib /Brepro /dll /noentry `
              /def:runtime/win32/xinput910.def "/out:$steamLayout/XboxWin32XInput910.dll" "$work/win32-xinput.obj" $lib
            $dxgiObjects = foreach ($source in @('dxgi', 'dxgi-frame')) {
              $object = "$work/win32-$source.obj"
              & "$llvm\clang++.exe" --target=x86_64-pc-windows-msvc -std=c++20 -O2 -ffreestanding `
                -fno-rtti -fno-exceptions -Wall -Wextra -Werror -D_WIN32_WINNT=0x0a00 -DWINVER=0x0a00 `
                -c "runtime/win32/$source.cpp" -o $object
              $object
            }
            & "$llvm\lld-link.exe" /nologo /machine:x64 /subsystem:windows,10.00 /appcontainer `
              /dynamicbase /nxcompat /highentropyva /nodefaultlib /Brepro /dll /noentry `
              /def:runtime/win32/dxgi.def "/out:$steamLayout/XboxWin32Dxgi.dll" @dxgiObjects $lib
            Copy-Item ui/signin/* $steamLayout
            Copy-Item "$env:RUNNER_TEMP/hosted-monogame/StardewStartupDiagnostic.dll" $steamLayout
            Copy-Item runtime/dos/* $steamLayout
            $qrArchive = Join-Path $work 'qrcode-generator-1.4.4.tgz'
            Invoke-WebRequest 'https://registry.npmjs.org/qrcode-generator/-/qrcode-generator-1.4.4.tgz' -OutFile $qrArchive
            if ((Get-FileHash $qrArchive).Hash -ne 'ab6ed47d378877441deae95972e07b2716c26545a735a23aa6b9d442b33026ed') {
              throw 'Unexpected QR renderer digest.'
            }
            & tar.exe -xf $qrArchive -C $work package/qrcode.js
            Copy-Item "$work/package/qrcode.js" $steamLayout
            [xml]$steam = Get-Content "$steamLayout/AppxManifest.xml"
            $steam.Package.Identity.SetAttribute('Name', 'XboxPortabilityProbe.ChildProcess.SteamCore')
            $internet = $steam.CreateElement('Capability', $ns)
            $internet.SetAttribute('Name', 'internetClient')
            $steam.Package.SelectSingleNode("*[local-name()='Capabilities']").AppendChild($internet) | Out-Null
            $steam.Package.Properties.DisplayName = 'Steam Core Loader Probe'
            $steam.GetElementsByTagName('VisualElements', 'http://schemas.microsoft.com/appx/manifest/uap/windows10')[0].SetAttribute('DisplayName', 'Steam Core Loader Probe')
            $steam.Save("$steamLayout/AppxManifest.xml")
            $presenter = Join-Path $env:RUNNER_TEMP 'xbox-fhd-present'
            $pin = (Get-FileHash "$presenter/SHA256SUMS").Hash
            & python -c "import sys; from pathlib import Path; from build_tools.presenter import stage_native_presenter; stage_native_presenter(Path(sys.argv[1]),Path(sys.argv[2]),sys.argv[3])" $steamLayout $presenter $pin
            Write-ProbePackage $steamLayout $steamArtifacts $cert
            $lifetimeLayout = Join-Path $work 'lifetime-layout'
            $lifetimeArtifacts = Join-Path $work 'lifetime-artifacts'
            Copy-Item -Recurse $layout $lifetimeLayout
            New-Item -ItemType Directory -Path $lifetimeArtifacts | Out-Null
            [xml]$lifetime = Get-Content "$lifetimeLayout/AppxManifest.xml"
            $lifetime.Package.Identity.SetAttribute('Name', 'XboxPortabilityProbe.ChildProcess.Lifetime')
            $lifetime.Package.Properties.DisplayName = 'Packaged process lifetime test'
            $lifetime.GetElementsByTagName('VisualElements', 'http://schemas.microsoft.com/appx/manifest/uap/windows10')[0].SetAttribute('DisplayName', 'Packaged process lifetime test')
            $lifetimeApp = $lifetime.Package.Applications.Application
            $appExtensions = $lifetime.CreateElement('Extensions', $ns)
            $uriExtension = $lifetime.CreateElement('uap', 'Extension', 'http://schemas.microsoft.com/appx/manifest/uap/windows10')
            $uriExtension.SetAttribute('Category', 'windows.protocol')
            $protocol = $lifetime.CreateElement('uap', 'Protocol', $uriExtension.NamespaceURI)
            $protocol.SetAttribute('Name', 'xbox-portability-probe-return')
            $uriExtension.AppendChild($protocol) | Out-Null
            $appExtensions.AppendChild($uriExtension) | Out-Null
            $lifetimeApp.AppendChild($appExtensions) | Out-Null
            $lifetime.Save("$lifetimeLayout/AppxManifest.xml")
            Write-ProbePackage $lifetimeLayout $lifetimeArtifacts $cert
            Write-ProbePackage $layout $artifacts $cert
            Write-ProbePackage $controlLayout $controlArtifacts $cert
          } finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-probe-windows-sdk
          path: ${{ runner.temp }}/xbox-probe/artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-probe-fresh-identity
          path: ${{ runner.temp }}/xbox-probe/control-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-steam-core-template
          path: ${{ runner.temp }}/xbox-probe/steam-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-probe-lifetime
          path: ${{ runner.temp }}/xbox-probe/lifetime-artifacts/
          if-no-files-found: error
