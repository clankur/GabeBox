# Meson machine file for the mesa-uwp build (pinned SternXD/meson uwp-subsystem
# fork). subsystem = 'uwp' selects AppContainer projects, WINAPI_FAMILY_APP
# and with_uwp in Mesa (runtime/mesa/patches/0001).
[host_machine]
system = 'windows'
subsystem = 'uwp'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[binaries]
c = 'cl'
cpp = 'cl'
ar = 'lib'
windres = 'rc'

[properties]
# AppContainer executables cannot run outside a package, so Meson must not
# try to run the configure-time test programs it links.
needs_exe_wrapper = true
