# Meson machine file for the mesa-uwp build (pinned SternXD/meson uwp-subsystem
# fork). subsystem = 'uwp' selects AppContainer projects, WINAPI_FAMILY_APP
# and with_uwp in Mesa (runtime/mesa/patches/0001).
[host_machine]
system = 'windows'
subsystem = 'uwp'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[binaries]
c = 'cl'
cpp = 'cl'
ar = 'lib'
windres = 'rc'

[properties]
# AppContainer executables cannot run outside a package, so Meson must not
# try to run the configure-time test programs it links.
needs_exe_wrapper = true

[built-in options]
# The Store C runtime (msvcrt.lib from the UWP LIB path) needs the WindowsApp
# umbrella library for its kernel imports; the pinned 26.2.2 release imports
# only VCRUNTIME140_APP and api-ms-win-* sets. Link it everywhere, including
# Meson's sanity and library checks (e.g. DirectX-Headers' find_library('d3d12')),
# rather than only through winlibs on final targets.
c_link_args = ['WindowsApp.lib']
cpp_link_args = ['WindowsApp.lib']
c_winlibs = []
cpp_winlibs = []
